<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.ic{flex:none;vertical-align:-3px}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 6px) 12px 10px}

.lg{width:34px;height:34px;border-radius:9px;background:var(--ac);display:grid;place-items:center;color:#fff}
header h1{margin:0;font-size:17px;flex:1;line-height:1.15}header h1 small{display:block;font-size:12px;font-weight:500;color:#9db3cc}
#st{font-size:11.5px;color:#9db3cc;display:flex;align-items:center;gap:5px;white-space:nowrap}#st:before{content:"";width:7px;height:7px;border-radius:7px;background:#3ccf8e}#st.w:before{background:#f0a020}
#bYo{min-height:32px;background:#ffffff1c;color:#fff;font-size:12.5px;padding:0 9px}
main{max-width:760px;margin:auto;padding:10px 12px}section{display:none}section.on{display:block}
.k{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.k h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.k h4 .ic{color:var(--ac)}
.s{color:var(--mut);font-size:13px}.e{text-align:center;color:var(--mut);padding:28px 0}

.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;display:flex}.bar i{display:block;height:100%;background:var(--ac)}
.row{margin:9px 0;font-size:13px}.row>div:first-child{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.seg{display:flex;gap:4px;padding:3px;background:var(--soft);border-radius:10px;margin:8px 0;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;background:transparent;font-size:13px;min-height:34px;color:var(--mut);padding:0 9px}.seg .on{background:#fff;color:var(--g);box-shadow:0 1px 3px #0d1b2a22}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips button{flex:none;min-height:34px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 12px}.chips .on{background:var(--g);color:#fff;border-color:var(--g)}
.hd{display:flex;align-items:center;gap:8px;margin:16px 2px 6px;font-size:12px;font-weight:700;letter-spacing:.8px;color:var(--mut);text-transform:uppercase}.hd:after{content:"";flex:1;height:1px;background:var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:#3c4a5c}
.chip.ok{background:var(--okS);color:var(--ok)}.chip.no{background:var(--badS);color:var(--bad)}.chip.am{background:var(--amS);color:#8a5c00}.chip.now{background:var(--ok);color:#fff}.chip.ac{background:var(--acS);color:#1d6fc4}
.mx{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px}.mx th{font-size:11px;color:var(--mut);font-weight:600}
.mx td{text-align:center;border-radius:6px;padding:7px 2px;font-weight:700;min-width:28px}.mx td.n{text-align:left;font-weight:600;padding-left:2px;min-width:118px;background:none}.mxw{overflow-x:auto}
.cl{background:#fff;border:1px solid var(--line);border-left:4px solid var(--k);border-radius:10px;padding:9px 11px;margin:7px 0}
.cl .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px}.cl .t .sp{margin-left:auto;color:var(--mut)}.cl .t .sp b{color:var(--ok)}
.cl .a1{font-size:16px;font-weight:800;margin-top:4px}.cl .m1{font-size:13.5px;margin-top:2px}.cl .m2{font-size:12.5px;color:var(--mut);margin-top:1px}
.cl .ac{display:flex;gap:6px;margin-top:8px}.cl .ac button{flex:1;min-height:36px;font-size:13px}.cl.vis{opacity:.6}
.it{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.it .h{width:42px;font-weight:700;flex:none}.it .x1{flex:1;min-width:0}.it .x1 b{display:block}.it .x1 span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{min-height:32px;padding:0 8px;background:#fff;border:1px solid var(--line)}
.dc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--st);border-radius:12px;padding:11px 12px;margin:8px 0}.dc.q{opacity:.55}
.dc .nm{font-weight:700;font-size:15px}.dc .m{font-size:12.5px;color:var(--mut);margin-top:2px}
.dc .wh{font-size:12.5px;margin-top:6px;padding:5px 8px;border-radius:8px;background:var(--soft)}
.es{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.es button{min-height:38px;font-size:12.5px;background:#fff;border:1px solid var(--line);padding:0 4px}

.mini2{display:flex;gap:6px;margin-top:6px}.mini2 button{flex:1;min-height:32px;font-size:12px;background:#fff;border:1px solid var(--line)}
.nota{background:var(--amS);border-radius:8px;padding:6px 9px;font-size:13px;margin-top:6px}
.stk{height:14px;border-radius:7px;overflow:hidden;display:flex;margin:8px 0 6px}.stk i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}summary{font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}summary .ic{color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{background:none;border-radius:0;min-height:60px;font-size:10px;color:var(--mut);padding:0;flex-direction:column;gap:3px}nav .on{color:var(--ac)}
.sh{position:fixed;inset:0;background:#0d1b2a99;display:none;align-items:flex-end;z-index:40}.sh.o{display:flex}
.sh>div{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 12px calc(16px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
.lab{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 0 4px}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ---------- VISITAS ---------- */
function vVis(){
 const L=Object.values(AV).sort((a,b)=>(b.t||'').localeCompare(a.t||''));let h=`<div class="k"><b>${L.length} aulas visitadas</b><p class="s" style="margin:4px 0 0">Incluye las que ya estaban guardadas en la nube. Deshacer borra la visita para todo el equipo.</p></div>`;let d0='';
 for(const a of L){const r=R[a.rid],d=a.t?a.t.slice(0,10):'';if(d!==d0){d0=d;h+=`<div class="hd">${d?lblF(d):'Sin fecha'}</div>`}
  h+=`<div class="k" style="padding:10px 12px;margin:6px 0"><div class="it" style="border:0;padding:0"><span class="h">${a.t?new Date(a.t).toTimeString().slice(0,5):''}</span><span class="x1"><b>Aula ${esc(r.aula)} · ${esc(r.cn)} ${esc(r.cur)}.º</b><span>${esc(r.mat)} · Gr. ${esc(r.gr)} · ${a.n} est.${a.por?' · '+esc(a.por):''}</span></span><button title="Conteo" onclick="cntOpen('${a.id}')">${ic('edit',15)}</button><button title="Deshacer" onclick="if(confirm('¿Quitar esta visita?'))quitarVis('${a.id}')">${ic('undo',15)}</button></div></div>`}
 $('#v-vis').innerHTML=h;
}

/* ---------- AJUSTES ---------- */
const RULES=`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /visitas_aulas/{id} { allow read, write: if true; }\n    match /docentes_votantes/{id} { allow read, write: if true; }\n  }\n}`;
function vCfg(){$('#v-cfg').innerHTML=`<div class="k"><h4>${ic('user')}Usuario</h4><div style="display:flex;gap:10px;align-items:center"><b style="flex:1">${esc(yo||'Sin elegir')}</b><button onclick="openS('sYo')">Cambiar</button></div></div>
 <div class="k"><h4>${ic('shield')}Nube</h4><p class="s" style="margin:0">Proyecto <b>vidal-decano</b> · colecciones <b>visitas_aulas</b> (las mismas de antes) y <b>docentes_votantes</b>.</p></div>
 <details><summary>${ic('shield')}Reglas de Firestore</summary><pre>${esc(RULES)}</pre><button onclick="navigator.clipboard.writeText(RULES).then(()=>toast('Copiado'))">Copiar</button></details>
 <div class="k"><h4>${ic('dl')}Exportar</h4><div class="f2"><button onclick="csvV()">Visitas (CSV)</button><button onclick="csvD()">Docentes (CSV)</button></div></div>`}
function dlCSV(name,rows){const s='﻿'+rows.map(a=>a.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download=name;a.click()}
function csvV(){dlCSV('visitas_tecnologia.csv',[['fecha','aula','carrera','semestre','materia','grupo','estudiantes','por'],...Object.values(AV).map(a=>{const r=R[a.rid];return[a.t,r.aula,r.car,r.cur,r.mat,r.gr,a.n,a.por]})])}
function csvD(){dlCSV('docentes_tecnologia.csv',[['docente','estado','quitado','nota','actualizado_por'],...docentes().map(d=>[d.n,{si:'confirmado',pend:'por confirmar',no:'oposición'}[d.est],d.q?'sí':'',d.nota,d.por])])}

/* ---------- base ---------- */
const NAV=[['res','home','Resumen'],['doc','users','Docentes'],['pen','target','Pendientes'],['hor','cal','Horario'],['aho','zap','Ahora'],['vis','list','Visitas'],['cfg','gear','Ajustes']];
function status(txt){const e=$('#st'),off=!navigator.onLine||!F||cache;e.className=off||pend?'w':'';e.textContent=txt||(!navigator.onLine?'Sin internet':!F?'Conectando':cache?'Sin nube':pend?'Guardando':'En línea')}
function draw(){$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${ic(i,21)}${l}</button>`).join('');$('#bYo').innerHTML=ic('user',15)+esc(yo||'¿Quién?');status();
 ({res:vRes,doc:vDoc,pen:vPen,hor:vHor,aho:vAho,vis:vVis,cfg:vCfg})[tab]()}
function render(){if(tab==='doc'&&document.activeElement?.id==='qD')return;cancelAnimationFrame(rq);rq=requestAnimationFrame(draw)}
function go(t){tab=t;document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='v-'+t));scrollTo(0,0);render()}
const openS=id=>{if(id==='sYo')yoL();$('#'+id).classList.add('o')},closeS=()=>document.querySelectorAll('.sh').forEach(s=>s.classList.remove('o'));
function yoL(){const L=['Vidal','Coordinación','Equipo docentes','Brigada 1','Brigada 2','Brigada 3'];$('#yoL').innerHTML=L.map(n=>`<button class="${n===yo?'on':''}" onclick="document.querySelectorAll('#yoL button').forEach(x=>x.classList.remove('on'));this.classList.add('on');yo='${n}';$('#yoTx').value=''">${n}</button>`).join('');$('#yoTx').value=L.includes(yo)?'':yo}
function yoSave(){const t=$('#yoTx').value.trim();if(t)yo=t;LS.s('vt_yo',yo);closeS();render()}
function toast(m,acts){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>`;(acts||[]).forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{t.classList.remove('o');f()};t.append(b)});t.classList.add('o');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('o'),acts?6000:2600)}
document.addEventListener('click',e=>{const s=e.target.closest('.sh');if(s&&e.target===s)return closeS();const b=e.target.closest('button');if(b&&b.dataset.t)go(b.dataset.t)});
addEventListener('online',()=>status());addEventListener('offline',()=>status());
setInterval(()=>{if((tab==='aho'||tab==='doc')&&!document.querySelector('.sh.o')&&document.activeElement?.tagName!=='INPUT')render()},60000);
$('#lg').innerHTML=ic('flask',19,2.2);derive();if(!yo)setTimeout(()=>openS('sYo'),400);
</script>
